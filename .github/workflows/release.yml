#
# Builds the desktop application for Windows and Linux.
#   - Push a tag like v2.1.0  -> builds both packages and publishes a GitHub Release
#   - Actions tab -> "Run workflow" -> builds both packages only (for testing, no release)

name: Build and release UI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Read APP_VERSION and compare with tag
        run: |
          VERSION=$(grep -oP '^APP_VERSION = "\K[^"]+' UI/ATEK_RF_MODULES_USER_INTERFACE.py)
          echo "APP_VERSION = $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "$TAG" != "v$VERSION" ]]; then
              echo "::error::Tag $TAG does not match APP_VERSION $VERSION (expected v$VERSION)"
              exit 1
            fi
          fi

  build-windows:
    name: Build Windows
    needs: check-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: python -m pip install customtkinter pyserial pillow pyinstaller
      - name: Build
        working-directory: UI
        run: >
          python -m PyInstaller --name ATEK_RF_MODULES_UI --onedir --noupx --clean --noconsole
          --icon=ATEK_MIDAS.ico --hidden-import PIL._tkinter_finder
          ATEK_RF_MODULES_USER_INTERFACE.py
      - name: Package
        shell: pwsh
        run: |
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md UI/dist/ATEK_RF_MODULES_UI/
          $name = "ATEK_RF_MODULES_UI_v${{ needs.check-version.outputs.version }}_windows_x64.zip"
          Compress-Archive -Path UI/dist/ATEK_RF_MODULES_UI -DestinationPath $name
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: "*.zip"

  build-linux:
    name: Build Linux
    needs: check-version
    # Ubuntu 22.04 (glibc 2.35): the package also runs on newer distributions
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y python3-venv python3-tk
      - name: Build
        working-directory: UI
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install customtkinter pyserial pillow pyinstaller
          pyinstaller --name ATEK_RF_MODULES_UI --onedir --noupx --clean --noconsole \
            --hidden-import PIL._tkinter_finder ATEK_RF_MODULES_USER_INTERFACE.py
      - name: Package
        run: |
          cp LICENSE THIRD_PARTY_NOTICES.md UI/dist/ATEK_RF_MODULES_UI/
          tar -czf "ATEK_RF_MODULES_UI_v${{ needs.check-version.outputs.version }}_linux_x64.tar.gz" \
            -C UI/dist ATEK_RF_MODULES_UI
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: "*.tar.gz"

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check-version, build-windows, build-linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: ATEK RF Modules UI v${{ needs.check-version.outputs.version }}
          files: packages/*
          generate_release_notes: true
